<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bolt Releases</title>
  <style>
    :root{
      --bg:#0b1016;
      --bg-2:#0e141c;
      --panel:rgba(16,22,30,.88);
      --line:rgba(255,255,255,.08);
      --text:#eef4ff;
      --muted:rgba(238,244,255,.70);
      --muted-2:rgba(238,244,255,.52);
      --accent:#5aa8ff;
      --accent-2:#2a74e6;
      --shadow:0 18px 56px rgba(0,0,0,.42);
      --radius:18px;
      --max:1120px;
      --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:var(--font);
      color:var(--text);
      background:
        radial-gradient(circle at 18% 8%, rgba(90,168,255,.14), transparent 20%),
        radial-gradient(circle at 82% 0%, rgba(87,211,156,.07), transparent 18%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      overflow-x:hidden;
    }

    .wrap{
      max-width:var(--max);
      margin:0 auto;
      padding:28px 18px 40px;
    }

    .header{
      padding:18px 20px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .badge{
      width:max-content;
      padding:7px 10px;
      border-radius:999px;
      border:1px solid rgba(90,168,255,.24);
      background:rgba(90,168,255,.10);
      color:#dceaff;
      font-family:var(--mono);
      font-size:12px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    h1{
      margin:0;
      font-size:clamp(30px, 4vw, 46px);
      line-height:1;
      letter-spacing:-.05em;
      font-weight:850;
    }

    .subtitle{
      margin:0;
      max-width:78ch;
      color:var(--muted);
      font-size:15px;
      line-height:1.65;
    }

    .panel{
      margin-top:18px;
      padding:18px;
      border-radius:var(--radius);
      border:1px solid var(--line);
      background:var(--panel);
      box-shadow:var(--shadow);
    }

    .panel-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .panel-title{
      margin:0;
      font-family:var(--mono);
      font-size:16px;
      letter-spacing:-.02em;
    }

    .status{
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted-2);
    }

    .toolbar{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      margin-bottom:14px;
    }

    .search{
      flex:1 1 280px;
      padding:13px 15px;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(7,10,14,.74);
      color:var(--text);
      outline:none;
      font-family:var(--mono);
      font-size:14px;
      transition:border-color .18s ease, box-shadow .18s ease;
    }

    .search:focus{
      border-color:rgba(90,168,255,.55);
      box-shadow:0 0 0 3px rgba(90,168,255,.10);
    }

    .toggle{
      border:1px solid rgba(90,168,255,.24);
      background:rgba(90,168,255,.10);
      color:#eaf2ff;
      padding:13px 15px;
      border-radius:14px;
      font-family:var(--mono);
      font-size:13px;
      font-weight:800;
      cursor:pointer;
      transition:transform .18s ease, background .18s ease, border-color .18s ease;
      white-space:nowrap;
    }

    .toggle:hover{
      transform:translateY(-1px);
      background:rgba(90,168,255,.16);
      border-color:rgba(90,168,255,.40);
    }

    .list{
      display:grid;
      gap:12px;
    }

    .item{
      border:1px solid var(--line);
      border-radius:16px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.14)),
        linear-gradient(135deg, rgba(90,168,255,.05), transparent 48%);
      padding:16px;
    }

    .item-top{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
      flex-wrap:wrap;
      margin-bottom:10px;
    }

    .title{
      margin:0;
      font-family:var(--mono);
      font-size:15px;
      font-weight:800;
      letter-spacing:-.01em;
    }

    .meta{
      color:var(--muted);
      font-family:var(--mono);
      font-size:12px;
      line-height:1.55;
      margin-top:6px;
    }

    .desc{
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .actions{
      margin-top:14px;
      display:grid;
      gap:10px;
    }

    .group{
      border:1px solid rgba(255,255,255,.06);
      border-radius:14px;
      padding:12px;
      background:rgba(8,12,17,.34);
    }

    .group-head{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom:10px;
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.06em;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:100%;
      padding:11px 14px;
      border-radius:12px;
      border:1px solid rgba(90,168,255,.24);
      background:linear-gradient(180deg, rgba(90,168,255,.16), rgba(42,116,230,.18));
      color:#fff;
      text-decoration:none;
      cursor:pointer;
      font-family:var(--mono);
      font-size:12px;
      font-weight:800;
      letter-spacing:.02em;
      transition:transform .18s ease, background .18s ease, border-color .18s ease;
    }

    .btn:hover{
      transform:translateY(-1px);
      background:linear-gradient(180deg, rgba(90,168,255,.22), rgba(42,116,230,.26));
      border-color:rgba(90,168,255,.42);
    }

    .linklike{
      border:0;
      background:none;
      color:#dceaff;
      font-family:var(--mono);
      font-size:12px;
      font-weight:800;
      cursor:pointer;
      padding:0;
      text-decoration:underline;
      text-underline-offset:3px;
    }

    .empty, .loading, .error{
      padding:18px;
      border-radius:16px;
      border:1px dashed rgba(255,255,255,.12);
      background:rgba(255,255,255,.02);
      color:var(--muted);
      font-family:var(--mono);
      line-height:1.65;
    }

    .footer{
      margin-top:16px;
      text-align:center;
      color:var(--muted-2);
      font-family:var(--mono);
      font-size:12px;
    }

    @media (max-width: 720px){
      .wrap{padding:16px}
      .header,.panel{padding:16px}
      .search,.toggle{width:100%}
    }

    @media (prefers-reduced-motion: reduce){
      *{
        animation:none !important;
        transition:none !important;
        scroll-behavior:auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <div class="brand">
        <div class="badge">Bolt Release Manager</div>
        <h1>Bolt</h1>
        <p class="subtitle">
          All available releases of Bolt, including both standard and CORE builds, are listed here. 
        </p>
      </div>
    </header>

    <section class="panel">
      <div class="panel-head">
        <h2 class="panel-title">Available releases</h2>
        <div class="status" id="status">Loading...</div>
      </div>

      <div class="toolbar">
        <input
          id="filterInput"
          class="search"
          type="search"
          placeholder="Search releases..."
          autocomplete="off"
        />
        <button id="toggleBtn" class="toggle" type="button">Looking for older versions?</button>
      </div>

      <div id="content" class="loading">Loading releases...</div>
      <div id="list" class="list" style="display:none;"></div>
    </section>

    <div class="footer">Release list</div>
  </main>

  <script>
    (() => {
      const OWNER = "SwifteexStudio";
      const REPO = "Swifteex";
      const API = `https://api.github.com/repos/${OWNER}/${REPO}/releases?per_page=100`;
      const MAX_PAGES = 3;

      const statusEl = document.getElementById("status");
      const contentEl = document.getElementById("content");
      const listEl = document.getElementById("list");
      const filterInput = document.getElementById("filterInput");
      const toggleBtn = document.getElementById("toggleBtn");

      let items = [];
      let showAll = false;

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function escapeHtml(text) {
        return String(text)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function normalizeText(value) {
        return String(value || "").toLowerCase();
      }

      function formatDate(iso) {
        if (!iso) return "unknown date";
        try {
          return new Date(iso).toLocaleDateString(undefined, {
            year: "numeric",
            month: "short",
            day: "2-digit"
          });
        } catch {
          return "unknown date";
        }
      }

      function parseVersionToken(text) {
        const match = String(text || "").match(/(\d{3,4})/);
        return match ? match[1] : null;
      }

      function toBoltVersion(token) {
        const n = Number(token);
        if (!Number.isFinite(n)) return "Bolt";
        const major = Math.floor(n / 100);
        const minor = String(n % 100).padStart(2, "0");
        return `Bolt ${major}.${minor}`;
      }

      function stripNotes(body) {
        const text = String(body || "").trim();
        if (!text) return "No release notes provided.";
        return text.replace(/\r\n/g, "\n").split("\n").slice(0, 6).join("\n");
      }

      function classifyAsset(asset) {
        const name = String(asset.name || "");
        if (/^boltinstallmanager(\d{3,4})\.exe$/i.test(name)) return "standard";
        if (/^boltinstallmanager(\d{3,4})core\.exe$/i.test(name)) return "core";
        return null;
      }

      function versionFromAsset(assetName, release) {
        const token =
          parseVersionToken(assetName) ||
          parseVersionToken(release.tag_name) ||
          parseVersionToken(release.name);
        return token ? toBoltVersion(token) : "Bolt";
      }

      function pickMatchingAssets(release) {
        const assets = Array.isArray(release.assets) ? release.assets : [];
        const standard = [];
        const core = [];

        for (const asset of assets) {
          const kind = classifyAsset(asset);
          if (kind === "standard") standard.push(asset);
          if (kind === "core") core.push(asset);
        }

        return { standard, core };
      }

      function buildReleaseItem(release, index) {
        const grouped = pickMatchingAssets(release);
        if (!grouped.standard.length && !grouped.core.length) return null;

        const firstAssetName =
          (grouped.standard[0] && grouped.standard[0].name) ||
          (grouped.core[0] && grouped.core[0].name) ||
          release.tag_name ||
          release.name ||
          "";

        const titleToken = parseVersionToken(firstAssetName);
        const title = titleToken ? toBoltVersion(titleToken) : "Bolt";
        const published = formatDate(release.published_at);
        const notes = stripNotes(release.body);
        const isLatest = index === 0;

        const standardButtons = grouped.standard.map(asset => {
          const version = versionFromAsset(asset.name, release);
          return `
            <a class="btn" href="${escapeHtml(asset.browser_download_url)}" download>
              Download ${escapeHtml(version)}
            </a>
          `;
        }).join("");

        const coreButtons = grouped.core.map(asset => {
          const version = versionFromAsset(asset.name, release);
          return `
            <a class="btn" href="${escapeHtml(asset.browser_download_url)}" download>
              Download ${escapeHtml(version)} CORE
            </a>
          `;
        }).join("");

        const searchText = normalizeText([
          release.tag_name,
          release.name,
          release.body,
          title,
          published,
          "standard",
          "core"
        ].join(" "));

        return {
          isLatest,
          searchText,
          html: `
            <article class="item" data-search="${escapeHtml(searchText)}">
              <div class="item-top">
                <div>
                  <h3 class="title">${escapeHtml(title)}${isLatest ? " <span class='status'>(Latest Version)</span>" : ""}</h3>
                  <div class="meta">
                    ${escapeHtml(release.name || "Release")}<br />
                    Published: ${escapeHtml(published)}<br />
                    ${release.prerelease ? "Prerelease" : "Stable"}
                  </div>
                </div>
                <div class="status">${escapeHtml(release.tag_name || "")}</div>
              </div>

              <p class="meta" style="margin:0 0 4px; white-space:pre-wrap;">${escapeHtml(notes)}</p>

              <div class="actions">
                ${grouped.standard.length ? `
                  <div class="group">
                    <div class="group-head">
                      <span>Standard build</span>
                      <span>${grouped.standard.length}</span>
                    </div>
                    <div class="list">
                      ${standardButtons}
                    </div>
                  </div>
                ` : ""}

                ${grouped.core.length ? `
                  <div class="group">
                    <div class="group-head">
                      <span>CORE build</span>
                      <span>${grouped.core.length}</span>
                    </div>
                    <div class="list">
                      ${coreButtons}
                    </div>
                  </div>
                ` : ""}
              </div>
            </article>
          `
        };
      }

      async function fetchAllReleases() {
        const all = [];
        for (let page = 1; page <= MAX_PAGES; page++) {
          const res = await fetch(`${API}&page=${page}`, {
            headers: { "Accept": "application/vnd.github+json" }
          });

          if (!res.ok) {
            throw new Error(`Request failed (${res.status})`);
          }

          const chunk = await res.json();
          if (!Array.isArray(chunk) || chunk.length === 0) break;

          all.push(...chunk);
          if (chunk.length < 100) break;
        }
        return all;
      }

      function render() {
        const query = normalizeText(filterInput.value.trim());
        const source = showAll ? items : items.slice(0, 1);
        const filtered = source.filter(item => !query || item.searchText.includes(query));

        if (!filtered.length) {
          listEl.style.display = "none";
          contentEl.style.display = "block";
          contentEl.className = "empty";
          contentEl.textContent = query
            ? "No releases match your search."
            : (showAll ? "No matching releases found." : "No release available.");
          return;
        }

        contentEl.style.display = "none";
        listEl.style.display = "grid";
        listEl.innerHTML = filtered.map(item => item.html).join("");
      }

      async function load() {
        setStatus("Scanning...");
        contentEl.style.display = "block";
        contentEl.className = "loading";
        contentEl.textContent = "Loading releases...";
        listEl.style.display = "none";
        listEl.innerHTML = "";

        try {
          const raw = await fetchAllReleases();
          const sorted = raw
            .filter(r => !r.draft)
            .sort((a, b) => new Date(b.published_at || 0) - new Date(a.published_at || 0));

          items = sorted.map(buildReleaseItem).filter(Boolean);
          setStatus(items.length ? "Ready" : "No matching releases");
          render();
        } catch (err) {
          console.error(err);
          contentEl.style.display = "block";
          contentEl.className = "error";
          contentEl.textContent = `Could not load releases: ${err.message}`;
          setStatus("Load failed");
        }
      }

      toggleBtn.addEventListener("click", () => {
        showAll = !showAll;
        toggleBtn.textContent = showAll ? "Show latest only" : "Looking for older versions?";
        render();
      });

      filterInput.addEventListener("input", render);
      load();
    })();
  </script>
</body>
</html>
